<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ecom-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#ecom-bg)" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Top App Window Bar -->
  <rect width="800" height="42" fill="#070a12" rx="16" />
  <circle cx="28" cy="21" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="46" cy="21" r="5.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="64" cy="21" r="5.5" fill="#10b981" opacity="0.8" />
  <rect x="250" y="10" width="300" height="22" rx="6" fill="#1e293b" opacity="0.6" />
  <text x="400" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">zenith.store/products/digital-gear</text>

  <!-- Navbar inside Store -->
  <rect x="30" y="60" width="740" height="40" rx="8" fill="#111827" stroke="rgba(255,255,255,0.05)" />
  <text x="50" y="85" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="700">ZENITH<tspan fill="#38bdf8">.DEV</tspan></text>
  <rect x="180" y="68" width="220" height="24" rx="12" fill="#0b0f19" />
  <text x="200" y="84" fill="#64748b" font-family="sans-serif" font-size="10">🔍 Search mechanical keyboards, audio...</text>
  <rect x="680" y="68" width="75" height="24" rx="6" fill="#3b82f6" />
  <text x="717" y="84" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">🛒 Cart (3)</text>

  <!-- Category Pills -->
  <rect x="30" y="115" width="80" height="24" rx="12" fill="#3b82f6" />
  <text x="70" y="131" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">All Items</text>
  <rect x="120" y="115" width="90" height="24" rx="12" fill="#1f2937" />
  <text x="165" y="131" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Keyboards</text>
  <rect x="220" y="115" width="80" height="24" rx="12" fill="#1f2937" />
  <text x="260" y="131" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Monitors</text>
  <rect x="310" y="115" width="80" height="24" rx="12" fill="#1f2937" />
  <text x="350" y="131" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Audio Gear</text>

  <!-- Product Cards Grid -->
  <!-- Product 1 -->
  <rect x="30" y="155" width="230" height="315" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" />
  <rect x="42" y="167" width="206" height="150" rx="8" fill="#1e293b" />
  <!-- Minimalist Keyboard drawing -->
  <rect x="62" y="200" width="166" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <circle cx="80" cy="220" r="4" fill="#38bdf8" />
  <circle cx="95" cy="220" r="4" fill="#6366f1" />
  <circle cx="110" cy="220" r="4" fill="#6366f1" />
  <text x="42" y="340" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">Cyber65 Mechanical Key</text>
  <text x="42" y="358" fill="#94a3b8" font-family="sans-serif" font-size="10">Hot-swap, RGB, Wireless</text>
  <text x="42" y="390" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700">$189.00</text>
  <rect x="42" y="415" width="206" height="36" rx="6" fill="#2563eb" />
  <text x="145" y="438" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

  <!-- Product 2 -->
  <rect x="285" y="155" width="230" height="315" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" />
  <rect x="297" y="167" width="206" height="150" rx="8" fill="#1e293b" />
  <!-- Minimalist Headphones drawing -->
  <circle cx="400" cy="235" r="40" fill="none" stroke="#6366f1" stroke-width="3" />
  <rect x="360" y="225" width="14" height="28" rx="4" fill="#6366f1" />
  <rect x="426" y="225" width="14" height="28" rx="4" fill="#6366f1" />
  <text x="297" y="340" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">AeroNoise Studio Pro</text>
  <text x="297" y="358" fill="#94a3b8" font-family="sans-serif" font-size="10">Spatial Audio &amp; ANC</text>
  <text x="297" y="390" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700">$249.00</text>
  <rect x="297" y="415" width="206" height="36" rx="6" fill="#2563eb" />
  <text x="400" y="438" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>

  <!-- Product 3 -->
  <rect x="540" y="155" width="230" height="315" rx="10" fill="#111827" stroke="rgba(255,255,255,0.06)" />
  <rect x="552" y="167" width="206" height="150" rx="8" fill="#1e293b" />
  <!-- Minimalist Monitor drawing -->
  <rect x="582" y="195" width="146" height="90" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
  <path d="M645,285 L645,305 L625,305 L685,305" stroke="#10b981" stroke-width="2" />
  <text x="552" y="340" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="600">UltraVision 4K 144Hz</text>
  <text x="552" y="358" fill="#94a3b8" font-family="sans-serif" font-size="10">IPS 10-Bit Color Deck</text>
  <text x="552" y="390" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="700">$599.00</text>
  <rect x="552" y="415" width="206" height="36" rx="6" fill="#2563eb" />
  <text x="655" y="438" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Add to Cart</text>
