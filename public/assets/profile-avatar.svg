<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="hoodie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" rx="40" fill="url(#bg-grad)" />

  <!-- Subtle Digital Circuit Lines -->
  <path d="M40,100 L120,100 L160,140 M360,120 L280,120 L240,80 M60,320 L130,320 L170,280 M340,300 L270,300 L230,340" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.25" fill="none" />
  <circle cx="160" cy="140" r="3.5" fill="#06b6d4" fill-opacity="0.6" />
  <circle cx="240" cy="80" r="3.5" fill="#6366f1" fill-opacity="0.6" />
  <circle cx="170" cy="280" r="3.5" fill="#06b6d4" fill-opacity="0.6" />
  <circle cx="230" cy="340" r="3.5" fill="#3b82f6" fill-opacity="0.6" />

  <!-- Halo Ring Behind Avatar -->
  <circle cx="200" cy="190" r="115" fill="none" stroke="url(#glow-grad)" stroke-width="2" filter="url(#soft-glow)" opacity="0.75" />
  <circle cx="200" cy="190" r="105" fill="#030712" fill-opacity="0.5" />

  <!-- Developer Silhouette with Modern Geometry -->
  <!-- Shoulders / Hoodie -->
  <path d="M110,340 C110,270 145,245 200,245 C255,245 290,270 290,340 Z" fill="url(#hoodie-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  <path d="M175,246 L200,280 L225,246 Z" fill="#0b1120" stroke="rgba(6,182,212,0.3)" stroke-width="1" />

  <!-- Head / Face Minimal Geometry -->
  <circle cx="200" cy="175" r="52" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />
  <!-- Hair Geometric Top -->
  <path d="M150,165 C150,125 180,118 200,118 C225,118 250,128 250,165 C242,145 220,135 200,135 C175,135 158,145 150,165 Z" fill="#06b6d4" fill-opacity="0.9" />

  <!-- Digital Glasses / HUD Visor -->
  <rect x="162" y="162" width="76" height="18" rx="6" fill="#030712" stroke="#06b6d4" stroke-width="1.5" />
  <path d="M168,171 L232,171" stroke="#06b6d4" stroke-width="1" stroke-dasharray="3,3" opacity="0.8" />
  
  <!-- Subtle glowing node on glasses corner -->
  <circle cx="230" cy="171" r="2" fill="#10b981" />

  <!-- Code Tag Floating Badge -->
  <g transform="translate(145, 305)">
    <rect width="110" height="28" rx="14" fill="#0b1120" stroke="rgba(6,182,212,0.4)" stroke-width="1.2" />
    <text x="55" y="18" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="600" text-anchor="middle">&lt;dev / bagas&gt;</text>
  </g>
</svg>
