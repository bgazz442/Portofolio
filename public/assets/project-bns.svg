<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bns-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041b17" />
      <stop offset="50%" stop-color="#072b24" />
      <stop offset="100%" stop-color="#02100d" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4a3e" />
      <stop offset="100%" stop-color="#062e26" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bns-bg)" stroke="rgba(52,211,153,0.2)" stroke-width="2" />

  <!-- Top App Window Bar -->
  <rect width="800" height="42" fill="#02100d" rx="16" />
  <circle cx="28" cy="21" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="46" cy="21" r="5.5" fill="#f59e0b" opacity="0.8" />
  <circle cx="64" cy="21" r="5.5" fill="#10b981" opacity="0.8" />
  <rect x="230" y="10" width="340" height="22" rx="6" fill="#092721" opacity="0.8" />
  <text x="400" y="25" fill="#6ee7b7" font-family="sans-serif" font-size="11" text-anchor="middle">bank-nusantara-syariah-25.vercel.app</text>

  <!-- Navbar inside Bank Portal -->
  <rect x="30" y="60" width="740" height="46" rx="10" fill="#062e26" stroke="rgba(52,211,153,0.2)" />
  <circle cx="56" cy="83" r="12" fill="url(#gold-grad)" />
  <text x="56" y="88" fill="#041b17" font-family="sans-serif" font-size="14" font-weight="900" text-anchor="middle">B</text>
  <text x="80" y="88" fill="#f8fafc" font-family="sans-serif" font-size="15" font-weight="800">BANK NUSANTARA <tspan fill="#fbbf24">SYARIAH</tspan></text>
  
  <text x="440" y="87" fill="#6ee7b7" font-family="sans-serif" font-size="11" font-weight="600">Simpanan</text>
  <text x="515" y="87" fill="#94a3b8" font-family="sans-serif" font-size="11">Pembiayaan</text>
  <text x="600" y="87" fill="#94a3b8" font-family="sans-serif" font-size="11">Layanan Digital</text>
  <rect x="680" y="70" width="75" height="26" rx="6" fill="url(#gold-grad)" />
  <text x="717" y="87" fill="#041b17" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">E-Banking</text>

  <!-- Hero Banner inside BNS -->
  <rect x="30" y="120" width="450" height="200" rx="12" fill="url(#card-grad)" stroke="rgba(52,211,153,0.3)" />
  <text x="55" y="160" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700" letter-spacing="1">AMANAH, BERKAH &amp; MODERN</text>
  <text x="55" y="195" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Solusi Finansial Syariah</text>
  <text x="55" y="222" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="800">Untuk Masa Depan Anda</text>
  <text x="55" y="255" fill="#a7f3d0" font-family="sans-serif" font-size="12">Pengelolaan keuangan transparan berlandaskan prinsip syariah terpercaya.</text>
  
  <rect x="55" y="275" width="130" height="32" rx="6" fill="#10b981" />
  <text x="120" y="295" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Buka Rekening</text>

  <!-- Islamic Debit Card Mockup -->
  <rect x="500" y="120" width="270" height="200" rx="14" fill="#09382e" stroke="rgba(251,191,36,0.4)" stroke-width="1.5" />
  <rect x="500" y="120" width="270" height="200" rx="14" fill="none" />
  <circle cx="720" cy="150" r="16" fill="url(#gold-grad)" opacity="0.85" />
  <text x="525" y="155" fill="#fbbf24" font-family="sans-serif" font-size="13" font-weight="800">BNS PLATINUM</text>
  <rect x="525" y="180" width="36" height="26" rx="4" fill="#d1d5db" opacity="0.7" />
  <text x="525" y="245" fill="#ffffff" font-family="monospace" font-size="14" letter-spacing="2">•••• •••• •••• 8825</text>
  <text x="525" y="285" fill="#6ee7b7" font-family="sans-serif" font-size="10">BAGAS C. NIRVANA</text>
  <text x="710" y="285" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="700">SYARIAH</text>

  <!-- 3 Highlights Cards below -->
  <rect x="30" y="335" width="235" height="135" rx="10" fill="#062e26" stroke="rgba(52,211,153,0.15)" />
  <text x="48" y="365" fill="#fbbf24" font-family="sans-serif" font-size="16">💳</text>
  <text x="48" y="390" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Tabungan Wadiah</text>
  <text x="48" y="410" fill="#94a3b8" font-family="sans-serif" font-size="10">Bebas biaya administrasi bulanan dan amanah.</text>
  <text x="48" y="445" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Pelajari Selengkapnya →</text>

  <rect x="282" y="335" width="235" height="135" rx="10" fill="#062e26" stroke="rgba(52,211,153,0.15)" />
  <text x="300" y="365" fill="#fbbf24" font-family="sans-serif" font-size="16">📈</text>
  <text x="300" y="390" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Investasi Mudharabah</text>
  <text x="300" y="410" fill="#94a3b8" font-family="sans-serif" font-size="10">Nisbah bagi hasil kompetitif dan menguntungkan.</text>
  <text x="300" y="445" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Simulasi Profit →</text>

  <rect x="535" y="335" width="235" height="135" rx="10" fill="#062e26" stroke="rgba(52,211,153,0.15)" />
  <text x="553" y="365" fill="#fbbf24" font-family="sans-serif" font-size="16">📱</text>
  <text x="553" y="390" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">BNS Mobile Banking</text>
  <text x="553" y="410" fill="#94a3b8" font-family="sans-serif" font-size="10">Transfer instan QRIS &amp; pembayaran zakat otomatis.</text>
  <text x="553" y="445" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="600">Unduh Aplikasi →</text>
</svg>
